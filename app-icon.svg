<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#252a4a"/>
      <stop offset="0.55" stop-color="#12142a"/>
      <stop offset="1" stop-color="#0a0b16"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.47" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ff7a45" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.35" stop-color="#ffd27e"/>
      <stop offset="0.75" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#e2582e"/>
    </radialGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="1" stop-color="#0c0d1c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="214" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="214" fill="url(#rim)"/>
  <!-- light -->
  <circle cx="512" cy="492" r="400" fill="url(#halo)"/>
  <circle cx="512" cy="492" r="292" fill="none" stroke="#ffb35c" stroke-opacity="0.16" stroke-width="10"/>
  <circle cx="512" cy="492" r="346" fill="none" stroke="#ffb35c" stroke-opacity="0.07" stroke-width="8"/>
  <!-- orb with a play-shaped cut -->
  <circle cx="512" cy="492" r="232" fill="url(#orb)"/>
  <path d="M468 392 Q448 380 448 403 V581 Q448 604 468 592 L612 504 Q632 492 612 480 Z" fill="url(#cut)"/>
  <ellipse cx="438" cy="380" rx="70" ry="38" fill="#ffffff" fill-opacity="0.35" transform="rotate(-28 438 380)"/>
</svg>
