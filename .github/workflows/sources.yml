name: Emulator sources

# Emulator projects rename release files from time to time; this catches it
# before users hit a failed install.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test live_sources -- --ignored --nocapture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
