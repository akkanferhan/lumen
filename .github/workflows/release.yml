name: Windows build

# develop → installer artifact for testing on the device
# v* tag  → draft GitHub release with the installers attached
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # Signed updater artifacts (latest.json) need the private key secret.
      # Without it the installers are still built, just without auto-update files.
      - name: Updater signing
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater artifacts"
            echo "args=--config src-tauri/tauri.no-updater.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ steps.sign.outputs.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Lumen ${{ github.ref_name }}
          releaseBody: Windows installers for Lumen. See the README for setup.
          releaseDraft: true
          # Not a prerelease: the updater reads /releases/latest, which skips prereleases.
          prerelease: false

      - name: Build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run tauri build -- ${{ steps.sign.outputs.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
