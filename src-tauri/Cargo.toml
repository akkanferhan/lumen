[package]
name = "lumen"
version = "0.1.0"
description = "Gamepad-first emulation frontend"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "fs", "io-util", "process", "macros", "sync", "time"] }
futures-util = "0.3"
zip = "2"
sevenz-rust = "0.6"
regex = "1"
walkdir = "2"
glob = "0.3"
# XInput backend keeps reading the controller while an emulator has focus.
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
