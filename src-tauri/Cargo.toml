[package]
name = "lumen"
version = "0.1.0"
description = "Gamepad-first emulation frontend"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "fs", "io-util", "process", "macros", "sync", "time"] }
futures-util = "0.3"
zip = "2"
sevenz-rust = "0.6"
regex = "1"
walkdir = "2"
toml_edit = "0.25"
sha2 = "0.11"
md-5 = "0.10"
aes = "0.8"
base64 = "0.22"
trash = "5"
serde_yaml_ng = "0.10"
glob = "0.3"
# XInput backend keeps reading the controller while an emulator has focus.
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
